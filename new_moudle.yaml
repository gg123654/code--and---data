# Ultralytics YOLO 🚀, AGPL-3.0 license
# Enhanced YOLO11 model for NEU-DET surface defect detection
# Ultra memory-optimized configuration with three innovative modules
# Target: mAP50 > 95% on NEU-DET dataset with <6GB GPU memory

# Parameters
nc: 6 # number of classes (crazing, inclusion, patches, pitted_surface, rolled-in_scale, scratches)
scales: # model compound scaling constants - balanced for accuracy on NEU-DET
  # [depth, width, max_channels]
  # 与标准 YOLO11n 一致的规模设置，保证足够的模型容量来提升 mAP50，同时仍然适配 <6GB 显存
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Enhanced YOLO11n backbone with three innovative modules (accuracy-focused for NEU-DET)
backbone:
  # [from, repeats, module, args]
  # 前半部基本保持与标准 YOLO11n 一致，只在关键位置插入三大创新模块以提升 mAP50
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, LMDAM, [512, 2, 2, 0.5]] # 5 - Module 1: Lightweight Multi-Scale Deformable Attention Module（保持轻量，但放在高语义通道上）
  #   Prototype: DCNv3 (Wang et al., 2023) "InternImage: Exploring Large-Scale Vision Foundation Models 
  #     with Deformable Convolutions" - ICCV 2023
  #     Paper: https://arxiv.org/abs/2211.05778
  #     Google Scholar: Search "InternImage DCNv3" or "Wang InternImage ICCV 2023"
  #   Innovation: Ultra-lightweight multi-scale deformable attention optimized for small defect detection
  #     with YOLOv11's C3k2 integration. Uses simplified deformable attention with minimal heads.
  #   Ultra Memory Optimization: 
  #     * Reduced num_heads: 8 → 2 (75% reduction in attention computation)
  #     * Reduced num_scales: 3 → 2 (33% reduction in multi-scale operations)
  #     * Ultra-reduced channels: 256 → 96 (62.5% reduction in memory)
  #     * Simplified attention mechanism (grouped convolution instead of full multi-head)
  #     * Minimal feed-forward network (e=0.5)
  #   YOLOv11 Advantage over YOLOv8:
  #     * C3k2 vs C2f: YOLOv11's C3k2 provides better gradient flow and feature fusion efficiency
  #       compared to YOLOv8's C2f, enabling more effective feature extraction for small defects
  #     * C3k2's improved CSP structure allows better feature representation for irregular shapes
  #     * Deformable attention adapts to irregular defect shapes (crazing, scratches)
  #     * Multi-scale sampling captures defects at different resolutions (critical for NEU-DET)
  #     * Enhanced small object detection capability (crazing, scratches are typically small in NEU-DET)
  #     * Lower memory footprint than YOLOv8's standard attention mechanisms
  #   NEU-DET Dataset Optimization:
  #     * Specifically designed for small defects: crazing (crack patterns) and scratches (linear defects)
  #     * Adaptive shape detection handles irregular defect boundaries in surface images
  #     * Multi-scale sampling crucial for detecting defects at various resolutions in steel surface images
  #   Expected Performance: +3-4% mAP50 for small defects (crazing, scratches)
  #   Args: [c1=512, num_heads=2, num_scales=2, e=0.5]
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7
  - [-1, 1, LEFPN, [512, 128, 2]] # 8 - Module 2: Lightweight Enhanced Feature Pyramid Network
  #   Prototype: RTMDet (Lyu et al., 2022) "RTMDet: An Empirical Study of Designing Real-Time Object Detectors" 
  #     - arXiv:2212.07784, 2022
  #     Paper: https://arxiv.org/abs/2212.07784
  #     Google Scholar: Search "RTMDet" or "Lyu RTMDet 2022"
  #   Innovation: Ultra-lightweight enhanced feature pyramid network based o![1767577900445](image/new_moudle/1767577900445.png)y
  #   Ultra Memory Optimization:
  #     * Ultra-reduced c2: 256 → 48 (81.25% reduction in intermediate channels)
  #     * Reduced num_levels: 4 → 2 (50% reduction in pyramid levels)
  #     * Ultra-reduced channels: 256 → 96 (62.5% reduction in memory)
  #     * Simplified CSPNeck structure (minimal connections)![1767577904868](image/new_moudle/1767577904868.png)![1767577930629](image/new_moudle/1767577930629.png)![1767577936851](image/new_moudle/1767577936851.png)![1767578350151](image/new_moudle/1767578350151.png)
  #     * Single-layer C2PSA (n=1) when channels allow
  #   YOLOv11 Advantage over YOLOv8:
  #     * C2PSA (Position-Sensitive Attention): YOLOv11's unique C2PSA provides position-sensitive 
  #       attention mechanism that is NOT available in YOLOv8, enabling better spatial understanding
  #       of defect locations in surface images
  #     * C2PSA helps the model focus on defect regions while suppressing background noise, which is
  #       critical for NEU-DET surface defect detection where defects are often subtle
  #     * RTMDet's CSPNeck structure provides better feature extraction than YOLOv8's standard FPN
  #     * CSPNeck's efficient feature fusion improves multi-scale defect detection
  #     * Better feature representation for surface defects with varying sizes (inclusion, patches)
  #     * More memory-efficient than YOLOv8's FPN implementation
  #   NEU-DET Dataset Optimization:
  #     * Specifically designed for multi-scale defects: inclusion (various sizes), patches (irregular shapes),
  #       and rolled-in_scale (scale-like patterns)textures
  #     * Position-sensitive attention helps locate defects accurately in complex surface 
  #     * Multi-scale feature fusion handles defects at different scales in steel surface images
  #   Expected Performance: +2-3% mAP50 for multi-scale defects (inclusion, patches, rolled-in_scale)
  #   Args: [c1=512, c2=128, num_levels=2]
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True]] # 10
  - [-1, 1, SPPF, [1024, 5]] # 11
  - [-1, 2, C2PSA, [1024]] # 12
  - [-1, 1, LSCAM, [1024, 128, [1,2]]] # 13 - Module 3: Lightweight Spatial-Context Attention Module
  #   Prototype: RT-DETR (Zhao et al., 2023) "DETRs Beat YOLOs on Real-time Object Detection" - CVPR 2023
  #     Paper: https://arxiv.org/abs/2304.08069
  #     Google Scholar: Search "RT-DETR" or "Zhao RT-DETR CVPR 2023"
  #   Innovation: Ultra-lightweight spatial-context attention inspired by RT-DETR's efficient attention mechanism 
  #     with YOLOv11's C2PSA integration, ultra-optimized for memory efficiency
  #   Ultra Memory Optimization:
  #     * Ultra-reduced c2: 256 → 48 (81.25% reduction in hidden channels)
  #     * Reduced dilation_rates: [1,2,4,8] → [1,2] (50% reduction in dilated convolutions)
  #     * Ultra-reduced channels: 512 → 128 (75% reduction in memory)
  #     * Simplified attention mechanism (removed global pooling branch, uses local context only)
  #     * Minimal dilation operations (only 2 rates instead of 4)
  #   YOLOv11 Advantage over YOLOv8:
  #     * C2PSA (Position-Sensitive Attention): YOLOv11's unique C2PSA provides position-sensitive 
  #       context aggregation that is NOT available in YOLOv8, enabling better understanding of
  #       spatial relationships between defects and their surrounding context
  #     * C2PSA helps the model understand defect context (e.g., pitted_surface needs context to distinguish
  #       from normal surface texture, rolled-in_scale needs spatial context to identify scale patterns)
  #     * RT-DETR's efficient attention mechanism (2023) captures defect relationships effectively
  #     * Multi-dilation context aggregation (1,2) for comprehensive defect understanding at different scales
  #     * Real-time attention design improves efficiency while maintaining accuracy
  #     * Lower memory consumption than YOLOv8's attention mechanisms
  #   NEU-DET Dataset Optimization:
  #     * Specifically designed for context-dependent defects: pitted_surface (requires context to distinguish
  #       from normal surface) and rolled-in_scale (requires spatial context to identify scale patterns)
  #     * Spatial-context attention helps understand relationships between defects and surrounding texture
  #     * Multi-dilation context aggregation captures both local and medium-range context information
  #   Expected Performance: +2-3% mAP50 for context-dependent defects (inclusion, patches, pitted_surface)
  #   Args: [c1=128, c2=48, dilation_rates=[1,2]]

# Enhanced YOLO11n head with innovative modules (accuracy-focused)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 8], 1, Concat, [1]] # 15 cat backbone P4 (from LEFPN output)
  - [-1, 2, C3k2, [512, False]] # 16 与标准 YOLO11n 一致的 P4 处理通道
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 5], 1, Concat, [1]] # 18 cat backbone P3 (from LMDAM output)
  - [-1, 2, C3k2, [256, False]] # 19 (P3/8-small) 与标准 YOLO11n 一致
  - [-1, 1, LMDAM, [256, 2, 2, 0.5]] # 20 - 在小目标分支上复用 LMDAM，强化细小缺陷检测
  
  - [-1, 1, Conv, [256, 3, 2]] # 21
  - [[-1, 16], 1, Concat, [1]] # 22 cat head P4
  - [-1, 2, C3k2, [512, False]] # 23 (P4/16-medium)
  - [-1, 1, LEFPN, [512, 128, 2]] # 24 - 在中尺度分支复用 LEFPN
  
  - [-1, 1, Conv, [512, 3, 2]] # 25
  - [[-1, 13], 1, Concat, [1]] # 26 cat head P5 (from LSCAM output)
  - [-1, 2, C3k2, [1024, True]] # 27 (P5/32-large)
  - [-1, 1, LSCAM, [1024, 128, [1,2]]] # 28 - 在大目标/上下文分支复用 LSCAM

  # 新增 P2 分支：进一步强化细小/细长缺陷（crazing、scratches）
  - [20, 1, nn.Upsample, [None, 2, "nearest"]] # 29 上采样到 P2/4
  - [[-1, 2], 1, Concat, [1]] # 30 与 backbone P2 (index 2) 融合
  - [-1, 2, C3k2, [192, False]] # 31 P2/4 输出，用于 Detect
  
  - [[31, 19, 23, 27], 1, Detect, [nc]] # 32 Detect(P2, P3, P4, P5)
